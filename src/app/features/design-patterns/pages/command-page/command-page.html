<section class="flex max-w-2xl flex-col gap-6 px-4 py-8">
  <div class="flex items-center gap-4 rounded-lg border border-slate-300 p-4">
    <span [class]="light.isOn() ? 'bg-yellow-300' : 'bg-slate-200'" class="size-10 rounded-full border border-slate-400"></span>
    <p class="font-medium text-slate-900" role="status">The light is {{ light.isOn() ? 'on' : 'off' }}</p>
  </div>

  <div class="flex flex-wrap gap-2">
    <button (click)="turnOn()" pButton type="button">Turn on</button>
    <button (click)="turnOff()" pButton severity="secondary" type="button">Turn off</button>
  </div>

  <div class="flex flex-col gap-2">
    <h2 class="text-lg font-semibold text-slate-900">History</h2>
    @if (remote.labels().length) {
      <ol class="list-decimal ps-6 text-slate-700">
        @for (label of remote.labels(); track $index) {
          <li>{{ label }}</li>
        }
      </ol>
    } @else {
      <p class="text-slate-700">No commands yet.</p>
    }
  </div>
</section>
