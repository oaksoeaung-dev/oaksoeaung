<p-fluid>
  <label pLabel [for]="field.id">{{ props.label }}</label>
  <input
    [type]="props.type"
    pInputText
    [id]="field.id ?? ''"
    [formControl]="formControl"
    [formlyAttributes]="field"
    [invalid]="formControl.invalid && formControl.touched"
  />
  @if (formControl.invalid && formControl.touched) {
    <p-message severity="error" size="small" variant="simple"><formly-validation-message [field]="field" /></p-message>
  }
</p-fluid>
